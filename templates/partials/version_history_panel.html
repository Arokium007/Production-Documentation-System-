<!-- Version History & Change Log Slide-Out Panel -->
<!-- Include this partial in any edit/verify page that has product.id in context -->
<!-- Requires: product.id to be available in template context -->

<div x-data="versionPanel()" x-cloak>

    <!-- Floating Toggle Button -->
    <button @click="open = true; loadData()"
        class="fixed bottom-6 right-6 z-40 w-14 h-14 bg-slate-900 text-white rounded-2xl shadow-2xl shadow-slate-400/30 hover:bg-slate-800 hover:scale-105 transition-all flex items-center justify-center group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="absolute right-16 bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap shadow-lg">
            Version History
        </span>
    </button>

    <!-- Backdrop -->
    <div x-show="open" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" 
        x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
        @click="open = false" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50"></div>

    <!-- Slide-Out Panel -->
    <div x-show="open" x-transition:enter="transition ease-out duration-300" 
        x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
        x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0"
        x-transition:leave-end="translate-x-full"
        class="fixed right-0 top-0 h-full w-full max-w-lg bg-white shadow-2xl z-50 flex flex-col overflow-hidden">

        <!-- Panel Header -->
        <div class="px-6 py-5 border-b border-gray-100 bg-white flex-shrink-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-slate-900 text-white rounded-xl flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-900">History & Revisions</h3>
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Version control & audit trail</p>
                    </div>
                </div>
                <button @click="open = false" class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-500 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Tabs -->
            <div class="flex gap-1 mt-4 bg-gray-100 p-1 rounded-xl">
                <button @click="tab = 'versions'" 
                    :class="tab === 'versions' ? 'bg-white text-slate-900 shadow-sm' : 'text-gray-500 hover:text-gray-700'"
                    class="flex-1 px-4 py-2 rounded-lg text-xs font-bold transition-all">
                    <span class="flex items-center justify-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        Versions <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px]" x-text="versions.length"></span>
                    </span>
                </button>
                <button @click="tab = 'changelog'" 
                    :class="tab === 'changelog' ? 'bg-white text-slate-900 shadow-sm' : 'text-gray-500 hover:text-gray-700'"
                    class="flex-1 px-4 py-2 rounded-lg text-xs font-bold transition-all">
                    <span class="flex items-center justify-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                        Change Log <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px]" x-text="changelog.length"></span>
                    </span>
                </button>
            </div>
        </div>

        <!-- Panel Content -->
        <div class="flex-1 overflow-y-auto">

            <!-- Loading -->
            <template x-if="loading">
                <div class="flex flex-col items-center justify-center py-20 text-gray-400">
                    <div class="w-8 h-8 border-2 border-gray-200 border-t-slate-900 rounded-full animate-spin mb-3"></div>
                    <p class="text-xs font-bold">Loading...</p>
                </div>
            </template>

            <!-- VERSIONS TAB -->
            <div x-show="!loading && tab === 'versions'" class="p-6">

                <!-- Empty State -->
                <template x-if="versions.length === 0">
                    <div class="text-center py-16">
                        <div class="w-12 h-12 bg-gray-50 rounded-2xl flex items-center justify-center mx-auto mb-3 text-gray-300">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        </div>
                        <p class="text-sm font-bold text-slate-700">No versions yet</p>
                        <p class="text-xs text-gray-400 mt-1">Versions are saved automatically when you save, submit, or approve.</p>
                    </div>
                </template>

                <!-- Timeline -->
                <div class="relative">
                    <!-- Timeline line -->
                    <div class="absolute left-4 top-0 bottom-0 w-px bg-gray-200" x-show="versions.length > 0"></div>

                    <template x-for="(v, i) in versions" :key="v.id">
                        <div class="relative pl-10 pb-6 last:pb-0">
                            <!-- Timeline dot -->
                            <div class="absolute left-2.5 top-1 w-3 h-3 rounded-full border-2 border-white shadow-sm"
                                :class="i === 0 ? 'bg-indigo-500' : 'bg-gray-300'"></div>

                            <div class="bg-white border border-gray-100 rounded-xl p-4 hover:border-gray-200 hover:shadow-sm transition-all group">
                                <div class="flex items-start justify-between gap-3">
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="text-xs font-bold text-slate-800" x-text="'v' + v.version_num"></span>
                                            <span class="px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider"
                                                :class="v.workflow_stage === 'finalized' ? 'bg-emerald-50 text-emerald-700' : 
                                                         v.workflow_stage === 'ready_for_web' ? 'bg-indigo-50 text-indigo-700' : 
                                                         'bg-gray-50 text-gray-600'"
                                                x-text="v.workflow_stage?.replace(/_/g, ' ') || 'draft'"></span>
                                        </div>
                                        <p class="text-sm font-medium text-slate-700 truncate" x-text="v.label"></p>
                                        <div class="flex items-center gap-3 mt-2 text-[10px] text-gray-400">
                                            <span class="flex items-center gap-1">
                                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                                <span x-text="v.created_by"></span>
                                            </span>
                                            <span class="flex items-center gap-1">
                                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                <span x-text="v.created_at"></span>
                                            </span>
                                        </div>
                                    </div>
                                    <button @click="restoreVersion(v.id, v.version_num)" 
                                        x-show="i > 0"
                                        class="opacity-0 group-hover:opacity-100 px-3 py-1.5 bg-indigo-50 text-indigo-700 rounded-lg text-[10px] font-bold hover:bg-indigo-100 transition-all whitespace-nowrap flex items-center gap-1">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                        Restore
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- CHANGELOG TAB -->
            <div x-show="!loading && tab === 'changelog'" class="p-4">

                <!-- Search/Filter -->
                <div class="mb-4 flex gap-2">
                    <div class="relative flex-1">
                        <svg class="w-3.5 h-3.5 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input x-model="changeFilter" type="text" placeholder="Filter by field or user..."
                            class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-transparent focus:bg-white focus:border-gray-200 rounded-lg text-xs font-medium transition-all outline-none placeholder-gray-400">
                    </div>
                </div>

                <!-- Empty State -->
                <template x-if="filteredChangelog.length === 0">
                    <div class="text-center py-16">
                        <div class="w-12 h-12 bg-gray-50 rounded-2xl flex items-center justify-center mx-auto mb-3 text-gray-300">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                        </div>
                        <p class="text-sm font-bold text-slate-700">No changes recorded</p>
                        <p class="text-xs text-gray-400 mt-1">Field-level changes will appear here after edits.</p>
                    </div>
                </template>

                <!-- Change Log entries -->
                <div class="space-y-2">
                    <template x-for="c in filteredChangelog" :key="c.id">
                        <div class="bg-gray-50 border border-gray-100 rounded-xl p-3 hover:bg-white hover:border-gray-200 transition-all">
                            <div class="flex items-start justify-between gap-2 mb-2">
                                <div class="flex items-center gap-2 min-w-0">
                                    <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded text-[9px] font-bold uppercase tracking-wide truncate max-w-[200px]" x-text="c.field_name"></span>
                                </div>
                                <span class="text-[9px] text-gray-400 whitespace-nowrap" x-text="c.timestamp"></span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-[10px]">
                                <div>
                                    <p class="font-bold text-gray-400 uppercase tracking-wider mb-0.5">Old</p>
                                    <div class="bg-red-50 border border-red-100 rounded-lg px-2 py-1.5 text-red-700 break-words max-h-20 overflow-y-auto font-mono" 
                                        x-text="c.old_value || '—'"></div>
                                </div>
                                <div>
                                    <p class="font-bold text-gray-400 uppercase tracking-wider mb-0.5">New</p>
                                    <div class="bg-emerald-50 border border-emerald-100 rounded-lg px-2 py-1.5 text-emerald-700 break-words max-h-20 overflow-y-auto font-mono"
                                        x-text="c.new_value || '—'"></div>
                                </div>
                            </div>
                            <div class="flex items-center gap-1.5 mt-2 text-[10px] text-gray-400">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                <span x-text="c.user" class="font-bold"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

        </div>
    </div>

    <!-- Restore Confirmation Modal -->
    <div x-show="showRestoreModal" x-transition class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-sm p-8 shadow-2xl text-center">
            <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
                </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-2">Restore Version?</h3>
            <p class="text-sm text-gray-500 mb-6">
                This will revert the product data to <strong x-text="'version ' + restoreVersionNum"></strong>. 
                Your current state will be saved as a new version before restoring.
            </p>
            <div class="flex gap-3">
                <button @click="showRestoreModal = false" class="flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition-colors text-sm">Cancel</button>
                <button @click="confirmRestore()" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-colors text-sm shadow-lg shadow-indigo-200">
                    Restore
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function versionPanel() {
    const productId = {{ product.id }};
    return {
        open: false,
        tab: 'versions',
        loading: false,
        versions: [],
        changelog: [],
        changeFilter: '',
        showRestoreModal: false,
        restoreVersionId: null,
        restoreVersionNum: null,
        
        get filteredChangelog() {
            if (!this.changeFilter.trim()) return this.changelog;
            const q = this.changeFilter.trim().toLowerCase();
            return this.changelog.filter(c => 
                c.field_name.toLowerCase().includes(q) || 
                c.user.toLowerCase().includes(q) ||
                (c.old_value || '').toLowerCase().includes(q) ||
                (c.new_value || '').toLowerCase().includes(q)
            );
        },
        
        async loadData() {
            if (this.versions.length > 0) return; // already loaded
            this.loading = true;
            try {
                const [vRes, cRes] = await Promise.all([
                    fetch(`/api/product/${productId}/versions`),
                    fetch(`/api/product/${productId}/changelog`)
                ]);
                this.versions = await vRes.json();
                this.changelog = await cRes.json();
            } catch (e) {
                console.error('Failed to load history:', e);
            }
            this.loading = false;
        },
        
        restoreVersion(versionId, versionNum) {
            this.restoreVersionId = versionId;
            this.restoreVersionNum = versionNum;
            this.showRestoreModal = true;
        },
        
        async confirmRestore() {
            try {
                const res = await fetch(`/api/product/${productId}/versions/${this.restoreVersionId}/restore`, {
                    method: 'POST'
                });
                const data = await res.json();
                if (data.ok) {
                    this.showRestoreModal = false;
                    window.location.reload();
                } else {
                    alert(data.error || 'Failed to restore');
                }
            } catch (e) {
                alert('Network error. Please try again.');
            }
        }
    };
}
</script>
